# Filtre fail2ban pour les demandes de réinitialisation de mot de passe de Klepsydrix (voir
# architecture.md §17.G/§17.H, backend/app/api/auth_endpoints.py::password_reset_request).
#
# Pourquoi une jail ici alors qu'aucun mot de passe n'est deviné à cette étape : le risque n'est pas
# l'intrusion mais l'ABUS D'ENVOI. Chaque demande visant un identifiant réel déclenche un email ;
# répétée, elle harcèle son destinataire et, surtout, fait classer le domaine expéditeur en
# indésirable par les fournisseurs de messagerie — un dégât durable et pénible à réparer, qui touche
# alors TOUS les emails de l'instance, y compris les liens de réinitialisation légitimes.
#
# TOUTE demande est journalisée, qu'elle corresponde ou non à un compte existant : distinguer les
# deux dans le journal reviendrait à publier la liste des identifiants valides à qui lit ce fichier,
# exactement ce que la réponse HTTP générique s'attache à cacher (voir password_reset_request).
#
# Un plancher applicatif existe désormais en plus de ce filtre (core/rate_limit.py) — il ne le rend
# pas inutile : fail2ban bannit au niveau réseau, plus tôt et pour toute la machine.
#
# Installation : voir klepsydrix-master-auth.conf pour la marche à suivre complète (identique, sous
# un autre nom de filtre/jail).
#
# Format de log attendu (voir main.py, logging.basicConfig) :
#   2026-08-21 09:14:02,318 WARNING [db=timetable] backend.app.api.auth_endpoints: Demande de
#   réinitialisation de mot de passe depuis 127.0.0.1 (identifiant : demo@klepsydrix.fr)

[Definition]

failregex = ^\s*\S+ \S+ WARNING \[db=\S+\] backend\.app\.api\.auth_endpoints: Demande de réinitialisation de mot de passe depuis <HOST> \(identifiant : .*\)\s*$

ignoreregex =

# Si l'auto-détection de date de fail2ban échoue sur ce format (rare, à vérifier avec
# `fail2ban-regex` avant activation) :
# datepattern = %%Y-%%m-%%d %%H:%%M:%%S,%%f
