# Filtre fail2ban pour la connexion locale de Klepsydrix (voir architecture.md §17.H,
# backend/app/api/auth_endpoints.py::login_local) — un compte local existe PAR BASE, potentiellement
# un par admin d'établissement ; contrairement au mot de passe maître (secret unique pour toute
# l'instance, voir klepsydrix-master-auth.conf), c'est la cible la plus probable en pratique.
#
# `login_local` journalise chaque ÉCHEC en WARNING (jamais un succès — le flux normal et quotidien
# de l'application, le journaliser en WARNING noierait le signal utile). AUCUN verrouillage
# applicatif (décision explicite, voir architecture.md §17.H) : la protection anti-brute-force
# repose ENTIÈREMENT sur ce filtre — voir §17.H pour le raisonnement complet (pourquoi un système
# applicatif "dégradé" en plus de fail2ban serait plus dangereux qu'utile : risque de faire croire à
# tort qu'une protection existe déjà sans fail2ban, et donc de le déployer moins sérieusement).
#
# Installation : voir klepsydrix-master-auth.conf pour la marche à suivre complète (identique, sous
# un autre nom de filtre/jail).
#
# Format de log attendu (voir main.py, logging.basicConfig) :
#   2026-08-15 17:11:24,795 WARNING [db=-] backend.app.api.auth_endpoints: Échec de connexion locale
#   depuis 127.0.0.1 (base : timetable, identifiant : demo@klepsydrix.fr)
# Le `[db=...]` en DÉBUT de ligne (issu de core/log_context.py::DbContextFilter, posé par
# DbSlugContextMiddleware) affiche désormais correctement la base résolue — voir architecture.md
# §16.G pour l'historique du bug de propagation du ContextVar à travers les dépendances FastAPI,
# corrigé en le posant au niveau middleware ASGI. Le filtre ci-dessous continue néanmoins d'accepter
# n'importe quelle valeur à cet endroit (`\[db=\S+\]`), sans en dépendre — la VRAIE base concernée
# est de toute façon répétée explicitement dans le corps du message ("base : <slug>").

[Definition]

failregex = ^\s*\S+ \S+ WARNING \[db=\S+\] backend\.app\.api\.auth_endpoints: Échec de connexion locale depuis <HOST> \(base : [^,]+, identifiant : .*\)\s*$

ignoreregex =

# Si l'auto-détection de date de fail2ban échoue sur ce format (rare, à vérifier avec
# `fail2ban-regex` avant activation) :
# datepattern = %%Y-%%m-%%d %%H:%%M:%%S,%%f
