# Filtre fail2ban pour l'authentification par mot de passe maître de Klepsydrix (voir
# architecture.md §19.A, backend/app/core/master_auth.py) — la cible la plus sensible de
# l'instance : un secret PARTAGÉ (pas une paire super_admins nommée) qui donne accès complet à la
# console d'administration (créer/dupliquer/sauvegarder/restaurer/supprimer N'IMPORTE QUELLE base).
#
# `verify_master_password()` journalise TOUTE tentative en WARNING, succès compris (voir
# architecture.md §19.A) — ce filtre ne retient que les échecs (RÉUSSIE en est volontairement
# exclu, sinon un vrai super-admin se ferait bannir après s'être connecté avec succès).
#
# Installation :
#   sudo cp klepsydrix-master-auth.conf /etc/fail2ban/filter.d/
#   sudo cp ../klepsydrix-master-auth.jail.conf.example /etc/fail2ban/jail.d/klepsydrix-master-auth.conf
#   # adapter le chemin de logpath dans le fichier jail à l'installation réelle, puis :
#   sudo systemctl restart fail2ban
#   sudo fail2ban-regex /chemin/vers/backend.log /etc/fail2ban/filter.d/klepsydrix-master-auth.conf
#     # pour vérifier que le filtre matche bien AVANT de l'activer en prod
#
# Format de log attendu (voir main.py, logging.basicConfig) :
#   2026-08-15 17:01:15,303 WARNING [db=-] backend.app.core.master_auth: Échec d'authentification
#   maître depuis 203.0.113.42
# `[db=-]` : ces routes n'ont jamais de base résolue (portée instance, voir architecture.md §16.A)
# — toujours "-", jamais un vrai slug, pour CE logger précis.

[Definition]

# <HOST> : substitution fail2ban standard (IPv4 et IPv6 gérés automatiquement, voir architecture.md
# §19.A sur la gestion dual-stack — rien de spécifique à faire ici, c'est le rôle de fail2ban).
# Les 3 variantes d'échec journalisées par verify_master_password() — voir master_auth.py. AUCUN
# verrouillage applicatif ici (décision explicite, voir architecture.md §19.A) : la protection
# anti-brute-force repose ENTIÈREMENT sur ce filtre — pas de 4e ligne "verrouillage anti-brute-force"
# à matcher, ce mécanisme n'existe plus côté application.
#   1. IP hors liste autorisée (master_db_local_auth.ip_allowlist)
#   2. Activé sans password_hash configuré (erreur de config, pas une vraie tentative — mais vaut
#      quand même la peine d'être compté : si ça se produit en boucle, quelqu'un teste ce endpoint)
#   3. Mot de passe incorrect
failregex = ^\s*\S+ \S+ WARNING \[db=-\] backend\.app\.core\.master_auth: Authentification maître refusée \(IP hors liste autorisée\) depuis <HOST>\s*$
            ^\s*\S+ \S+ WARNING \[db=-\] backend\.app\.core\.master_auth: Authentification maître activée sans db_master_password_hash configuré — refusée depuis <HOST>\s*$
            ^\s*\S+ \S+ WARNING \[db=-\] backend\.app\.core\.master_auth: Échec d'authentification maître depuis <HOST>\s*$

# Explicite en plus des 4 lignes ci-dessus (qui n'incluent déjà pas "RÉUSSIE") — filet de sécurité
# lisible : une authentification réussie ne doit JAMAIS compter comme une tentative à bannir.
ignoreregex = ^\s*\S+ \S+ WARNING \[db=-\] backend\.app\.core\.master_auth: Authentification maître RÉUSSIE.*$

# Si l'auto-détection de date de fail2ban échoue sur ce format (rare, mais à vérifier avec
# `fail2ban-regex` avant activation) :
# datepattern = %%Y-%%m-%%d %%H:%%M:%%S,%%f
